name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + build + test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x', '26.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Required before tests: the distribution test runs the built CLI from dist/
      # (ADR-0010) instead of skipping.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  smoke:
    name: clean-checkout smoke (node 24.x)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      # The smoke test does not use this workspace's build: it clones the
      # commit into a temporary directory and runs `npm ci` + `npm run build`
      # there, proving the documented first run works from an unbuilt checkout.
      - name: Clean-checkout smoke test
        run: npm run smoke:clean-checkout
